# Railway deployment configuration
# Dockerfile.compose is for Docker Compose (self-hosted), Railway uses Nixpacks
[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn trackwatch.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/ping"
healthcheckTimeout = 300
