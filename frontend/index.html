<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Viewport: user-scalable=no evita zooms accidentales en inputs móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>TrackWatch - Track New Music Releases from Your Favorite Artists</title>
  <meta name="description"
    content="Stay updated on the latest music releases from your favorite artists. TrackWatch connects with your Spotify account to track artists, notify you of new releases and add them to your Spotify playlists automatically." />
  <meta name="keywords"
    content="spotify, music tracking, new releases, artist tracker, music notifications, playlist generator, music discovery, spotify new releases, spotify tracker, releases tracker, trackwatch" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://trackwatch.emlopezr.com/" />
  <meta property="og:title" content="TrackWatch - Never Miss New Music from Your Favorite Artists" />
  <meta property="og:description"
    content="TrackWatch connects with Spotify to track your favorite artists, notify you of new releases, and automatically add them to your playlists. Discover complete discographies with our Playlist Generator." />
  <meta property="og:image" content="https://trackwatch.emlopezr.com/preview.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://trackwatch.emlopezr.com/" />
  <meta property="twitter:title" content="TrackWatch - Spotify Release Tracker" />
  <meta property="twitter:description"
    content="Automatically track new releases from your favorite artists on Spotify. Get notifications and auto-updated playlists with TrackWatch." />
  <meta property="twitter:image" content="https://trackwatch.emlopezr.com/preview.jpg" />

  <!-- PWA: Theme & App Identity -->
  <meta name="theme-color" content="#242424" />
  <meta name="application-name" content="TrackWatch" />

  <!-- PWA: iOS/Safari Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TrackWatch" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- PWA: Android/Chrome Support -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA: Manifest & Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />

  <!-- PWA: Microsoft/Edge Support -->
  <meta name="msapplication-TileColor" content="#242424" />
  <meta name="msapplication-TileImage" content="/icon.png" />
</head>

<body>
  <div id="root"></div>
  <script src="/env.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
